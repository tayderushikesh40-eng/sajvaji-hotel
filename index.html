<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savaji Restaurant - Billing System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
        :root {
            --primary-color: #d97706;
            --primary-hover: #b45309;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: linear-gradient(135deg, #1e293b, #0f172a); color: rgb(255, 255, 255); padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); }
        header h1 { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        header h1 i { color: var(--primary-color); }
        .container { display: grid; grid-template-columns: 1fr 380px; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }
        .menu-section { display: flex; flex-direction: column; gap: 20px; }
        .category-card { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .category-title { font-size: 1.25rem; font-weight: 700; padding-bottom: 10px; margin-bottom: 15px; border-bottom: 2px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .category-title.starter { color: #d97706; border-color: #fde68a; }
        .category-title.nonveg { color: #dc2626; border-color: #fecaca; }
        .category-title.veg { color: #16a34a; border-color: #bbf7d0; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .item-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 12px 15px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s ease; background: #fafafa; }
        .item-card:hover { border-color: var(--primary-color); box-shadow: 0 2px 8px rgba(0,0,0,0.05); background: #fff; }
        .item-name { font-weight: 600; font-size: 1rem; margin-bottom: 8px; text-transform: capitalize; }
        .price-options { display: flex; gap: 8px; margin-top: 5px; }
        .btn-add { flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s, border-color 0.2s; }
        .btn-add:hover { background: #e0b402; border-color: var(--primary-color); color: var(--primary-color); }
        .billing-section { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; flex-direction: column; height: calc(100vh - 110px); position: sticky; top: 20px; }
        .billing-header { font-size: 1.2rem; font-weight: 700; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .cart-items { flex: 1; overflow-y: auto; margin: 15px 0; padding-right: 5px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border-color); }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-weight: 600; font-size: 0.9rem; }
        .cart-item-price { font-size: 0.8rem; color: var(--text-muted); }
        .qty-controls { display: flex; align-items: center; gap: 8px; margin-left: 10px; }
        .qty-btn { width: 26px; height: 26px; border-radius: 4px; border: 1px solid var(--border-color); background: #f1f5f9; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .qty-btn:hover { background: #0664df; }
        .billing-footer { border-top: 2px solid var(--border-color); padding-top: 15px; }
        .summary-row { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
        .btn-print { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-print:hover { background: var(--primary-hover); }
        .empty-cart { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.95rem; }

        .main-header { flex-wrap: wrap; gap: 18px; }
        .logo-container { display:flex; align-items:center; gap:10px; white-space:nowrap; }
        .logo-icon { color:var(--primary-color); font-size:1.35rem; }
        .brand-name { font-size:1.35rem; font-weight:700; }
        .nav-links { display:flex; align-items:center; gap:18px; }
        .nav-links a { color:#e2e8f0; text-decoration:none; font-size:.9rem; font-weight:600; }
        .nav-links a:hover, .nav-links a.active { color:#fbbf24; }
        .search-container { position:relative; flex:1; max-width:420px; min-width:220px; }
        .search-container input { width:100%; padding:10px 40px 10px 14px; border:1px solid #475569; border-radius:9px; outline:none; background:#fff; color:#1e293b; }
        .search-icon { position:absolute; right:13px; top:50%; transform:translateY(-50%); color:#64748b; }
        .header-actions { display:flex; align-items:center; gap:10px; }
        .action-btn, .menu-icon { width:40px; height:40px; border:1px solid #475569; border-radius:9px; background:#1e293b; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; }
        .action-btn:hover, .menu-icon:hover { background:#334155; }
        .dropdown-content { display:none; position:absolute; z-index:1000; right:0; top:48px; min-width:210px; background:#fff; border:1px solid #e2e8f0; border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.18); padding:7px; }
        .dropdown-content.show { display:block; }
        .dropdown-content button { width:100%; text-align:left; border:0; background:#fff; padding:10px 12px; border-radius:7px; cursor:pointer; font-size:.9rem; color:#1e293b; }
        .dropdown-content button:hover { background:#f1f5f9; }
        .modal { display:none; position:fixed; inset:0; z-index:2000; background:rgba(15,23,42,.6); align-items:center; justify-content:center; padding:20px; }
        .modal.show { display:flex; }
        .modal-card { width:min(460px,100%); background:#fff; border-radius:14px; padding:24px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
        .modal-header h2 { font-size:1.15rem; }
        .close-btn { border:0; background:#f1f5f9; width:32px; height:32px; border-radius:7px; cursor:pointer; }
        .form-group { margin-bottom:13px; }
        .form-group label { display:block; font-size:.85rem; font-weight:600; margin-bottom:6px; }
        .form-group input { width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; outline:none; }
        .modal-primary { width:100%; padding:11px; border:0; border-radius:8px; background:var(--primary-color); color:#fff; font-weight:700; cursor:pointer; }
        .history-list { max-height:420px; overflow:auto; }
        .history-item { border:1px solid #e2e8f0; border-radius:9px; padding:12px; margin-bottom:9px; }
        .history-item strong { display:block; margin-bottom:4px; }
        .history-item small { color:#64748b; }
        .print-bill { display:none; }
        .search-result-item { padding:9px 11px; cursor:pointer; border-radius:6px; color:#1e293b; }
        .search-result-item:hover { background:#f1f5f9; }
        .bluetooth-status { padding:10px 12px; background:#eff6ff; color:#1d4ed8; border-radius:8px; margin-bottom:14px; font-size:.9rem; }
        @media print {
            body * { visibility:hidden !important; }
            #printBill, #printBill * { visibility:visible !important; }
            #printBill { display:block !important; position:absolute; left:0; top:0; width:100%; padding:20px; background:#fff; color:#000; font-family:Arial,sans-serif; }
            .print-header { text-align:center; border-bottom:2px solid #000; padding-bottom:12px; margin-bottom:14px; }
            .print-header h1 { font-size:24px; margin-bottom:5px; }
            .print-header p { margin:3px 0; font-size:12px; }
            .print-meta { display:flex; justify-content:space-between; font-size:12px; margin-bottom:12px; }
            .print-table { width:100%; border-collapse:collapse; font-size:12px; }
            .print-table th, .print-table td { border-bottom:1px solid #ccc; padding:7px 4px; text-align:left; }
            .print-table th:nth-child(2), .print-table td:nth-child(2),
            .print-table th:nth-child(3), .print-table td:nth-child(3),
            .print-table th:nth-child(4), .print-table td:nth-child(4) { text-align:right; }
            .print-total { margin-top:12px; border-top:2px solid #000; padding-top:9px; display:flex; justify-content:space-between; font-weight:700; font-size:15px; }
            .print-footer { text-align:center; margin-top:22px; font-size:11px; }
        }

        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .billing-section { height: auto; position: static; } }
    </style>
</head>
<body><header class="main-header">
    <div class="logo-container">
        <i class="fa-solid fa-utensils logo-icon"></i>
        <span class="brand-name">Savaji Restaurant</span>
    </div>
    
    <nav class="nav-links">
        <a href="#home" class="active">Home</a>
        <a href="#menu">Menu</a>
        <a href="#orders">Orders</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search delicious food...">
        <i class="fa-solid fa-search search-icon"></i>
        <div id="searchResults" class="dropdown-content"></div>
    </div>

    <div class="header-actions">
        <button class="action-btn printer-btn" onclick="connectPrinter()">
            <i class="fa-solid fa-print"></i>
        </button>
        <div class="menu-icon" onclick="toggleDropdown()">
            <i class="fa-solid fa-ellipsis-vertical"></i>
            <div id="dropdownMenu" class="dropdown-content">
                <button onclick="toggleAuth(); closeDropdown();">🔐 Login / Logout</button>
                <button onclick="openProfile(); closeDropdown();">👤 Profile</button>
                <button onclick="openHistory(); closeDropdown();">🧾 Billing History</button>
                <button onclick="openBluetooth(); closeDropdown();">🔵 Bluetooth Printer</button>
            </div>
        </div>
    </div>
</header>
    <div class="container">
        <div class="menu-section" id="menuContainer"></div>
        <div class="billing-section">
            <div class="billing-header">
                <span>Current Order</span>
                <i class="fa-solid fa-receipt"></i>
            </div>
            <div class="cart-items" id="cartItems">
                <div class="empty-cart">No items added yet. Click on menu items to add to order.</div>
            </div>
            <div class="billing-footer">
                <div class="summary-row">
                    <span>Total Amount:</span>
                    <span id="grandTotal">₹0</span>
                </div>
                <button class="btn-print" onclick="printCurrentBill()">
                    <i class="fa-solid fa-print"></i> Print Bill
                </button>
            </div>
        </div>
    </div>

    <!-- Current bill print area: only this section is printed -->
    <div id="printBill" class="print-bill"></div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>🔐 Login</h2>
                <button class="close-btn" onclick="closeModal('loginModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input id="loginUsername" type="text" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input id="loginPassword" type="password" placeholder="Enter password">
            </div>
            <button class="modal-primary" onclick="loginUser()">Login</button>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>👤 Profile</h2>
                <button class="close-btn" onclick="closeModal('profileModal')">✕</button>
            </div>
            <div class="form-group">
                <label>Restaurant / User Name</label>
                <input id="profileName" type="text" placeholder="Enter name">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input id="profileMobile" type="text" placeholder="Enter mobile number">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input id="profileAddress" type="text" placeholder="Enter address">
            </div>
            <button class="modal-primary" onclick="saveProfile()">Save Profile</button>
        </div>
    </div>

    <!-- Billing History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>🧾 Billing History</h2>
                <button class="close-btn" onclick="closeModal('historyModal')">✕</button>
            </div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <!-- Bluetooth Modal -->
    <div id="bluetoothModal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>🔵 Bluetooth Printer</h2>
                <button class="close-btn" onclick="closeModal('bluetoothModal')">✕</button>
            </div>
            <div id="bluetoothStatus" class="bluetooth-status">Printer not connected.</div>
            <button class="modal-primary" onclick="connectPrinter()">Connect Bluetooth Printer</button>
        </div>
    </div>

    <script>
        const menuData = [
            {
                category: "Starter", type: "starter", icon: "fa-sun",
                items: [
                    {name: "bisleri", full:20,half:null},
                    { name: "Roasted papad", full: 15, half: null },
                    { name: "Masala papad", full: 25, half: null },
                    { name: "Fry papad", full: 20, half: null }
                    
                ]
            },
            {
                category: "Non Veg", type: "nonveg", icon: "fa-drumstick-bite",
                items: [
                    { name: "Chicken kari", full: 200, half: 100 },
                    { name: "Chicken masala", full: 200, half: 100 },
                    { name: "Chicken lapeta", full: 200, half: null },
                    { name: "Chicken fry", full: 200, half: null },
                    { name: "Chicken sauji", full: 200, half: 100 },
                    { name: "Chicken roasted", full: 200, half: null },
                    { name: "Chicken handi", full: 700, half: 400 },
                    { name: "Matan kari", full: 240, half: 140 },
                    { name: "Matan masala", full: 250, half: 150 },
                    { name: "Matan lapeta", full: 250, half: null },
                    { name: "Matan fry", full: 250, half: null },
                    { name: "Matan sauji", full: 250, half: 150 },
                    { name: "Matan roasted", full: 250, half: null },
                    { name: "Matan handi", full: 1200, half: 600 },
                    { name: "Anda kari", full: 100, half: null },
                    { name: "Anda masala", full: 100, half: null },
                    { name: "Anda burji", full: 90, half: null },
                    { name: "Anda burji kari", full: 140, half: null }
                ]
            },
            {
                category: "Veg", type: "veg", icon: "fa-leaf",
                items: [
                    { name: "Panir kari", full: 160, half: 100 },
                    { name: "Panir masala", full: 160, half: 100 },
                    { name: "Panir lapeta", full: 200, half: null },
                    { name: "Panir burji", full: 170, half: null },
                    { name: "Panir burji kari", full: 200, half: null },
                    { name: "Dal fry", full: 140, half: 80 },
                    { name: "Dal tadaka", full: 140, half: 80 },
                    { name: "Sev baji", full: 140, half: 80 },
                    { name: "Jeera rice", full: 100, half: 50 },
                    { name: "Plain rice", full: 90, half: 50 },
                    { name: "Roti", full: 12, half: null },
                    {name: "boil", full:15,half: null},
                    { name: "Bhakar", full: 25, half: null }
                ]
            }
        ];

        let cart = {};
        let bluetoothDevice = null;
        let bluetoothServer = null;
        let bluetoothCharacteristic = null;
        let serialPort = null;
        let serialWriter = null;

        // BT-58D / Izo Printer
        const PRINTER_NAME = "Izo Printer";
        const PRINTER_BAUD_RATE = 9600;

        // Common BLE thermal-printer service/characteristic UUIDs.
        // The code also scans all discovered GATT services/characteristics,
        // so it is not limited to one exact firmware UUID.
        const COMMON_BLE_SERVICES = [
            "0000ffe0-0000-1000-8000-00805f9b34fb",
            "0000ffe5-0000-1000-8000-00805f9b34fb",
            "000018f0-0000-1000-8000-00805f9b34fb",
            "49535343-fe7d-4ae5-8fa9-9fafd205e455"
        ];

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'");
        }

        function renderMenu() {
            const menuContainer = document.getElementById("menuContainer");
            menuContainer.innerHTML = "";

            menuData.forEach(cat => {
                const card = document.createElement("div");
                card.className = "category-card";
                let itemsHtml = "";

                cat.items.forEach(item => {
                    let priceBtns = "";

                    if (item.half !== null) {
                        priceBtns += `<button class="btn-add" onclick="addToCart('${escapeQuotes(item.name)}', 'Half', ${item.half})">
                            <span>Half</span><strong>₹${item.half}</strong>
                        </button>`;
                    }

                    priceBtns += `<button class="btn-add" onclick="addToCart('${escapeQuotes(item.name)}', 'Full', ${item.full})">
                        <span>Full</span><strong>₹${item.full}</strong>
                    </button>`;

                    itemsHtml += `
                        <div class="item-card">
                            <div class="item-name">${item.name}</div>
                            <div class="price-options">${priceBtns}</div>
                        </div>`;
                });

                card.innerHTML = `
                    <div class="category-title ${cat.type}">
                        <i class="fa-solid ${cat.icon}"></i> ${cat.category}
                    </div>
                    <div class="items-grid">${itemsHtml}</div>`;

                menuContainer.appendChild(card);
            });
        }

        function addToCart(name, portion, price) {
            const itemKey = `${name} (${portion})`;

            if (cart[itemKey]) {
                cart[itemKey].qty += 1;
            } else {
                cart[itemKey] = { name, portion, price, qty: 1 };
            }

            updateCart();
        }

        function updateQuantity(itemKey, change) {
            if (cart[itemKey]) {
                cart[itemKey].qty += change;

                if (cart[itemKey].qty <= 0) {
                    delete cart[itemKey];
                }
            }

            updateCart();
        }

        function updateCart() {
            const cartItemsContainer = document.getElementById("cartItems");
            const grandTotalEl = document.getElementById("grandTotal");
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                cartItemsContainer.innerHTML =
                    `<div class="empty-cart">No items added yet. Click on menu items to add to order.</div>`;
                grandTotalEl.innerText = "₹0";
                return;
            }

            let html = "";
            let total = 0;

            keys.forEach(key => {
                const item = cart[key];
                const itemTotal = item.price * item.qty;
                total += itemTotal;

                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name} (${item.portion})</div>
                            <div class="cart-item-price">₹${item.price} × ${item.qty} = ₹${itemTotal}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQuantity('${escapeQuotes(key)}', -1)">−</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="updateQuantity('${escapeQuotes(key)}', 1)">+</button>
                        </div>
                    </div>`;
            });

            cartItemsContainer.innerHTML = html;
            grandTotalEl.innerText = `₹${total}`;
        }

        function getCartTotal() {
            return Object.values(cart).reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function generateBillNumber() {
            return "SV-" + Date.now().toString().slice(-8);
        }

        function saveBillToHistory(billNumber, dateText) {
            const items = Object.values(cart).map(item => ({
                name: item.name,
                portion: item.portion,
                price: item.price,
                qty: item.qty,
                total: item.price * item.qty
            }));

            const bill = {
                billNumber,
                date: dateText,
                total: getCartTotal(),
                items
            };

            const history = JSON.parse(localStorage.getItem("savajiBillingHistory") || "[]");
            history.unshift(bill);
            localStorage.setItem("savajiBillingHistory", JSON.stringify(history.slice(0, 100)));
        }

        async function printCurrentBill() {
            const keys = Object.keys(cart);

            if (keys.length === 0) {
                alert("पहले Current Order में item select करें।");
                return;
            }

            const now = new Date();
            const billNumber = generateBillNumber();
            const dateText = now.toLocaleString("en-IN");

            let total = 0;
            const items = keys.map(key => {
                const item = cart[key];
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                return { ...item, total: itemTotal };
            });

            // Keep the existing on-screen bill area updated. Printing is done directly through ESC/POS.
            document.getElementById("printBill").innerHTML = `
                <div class="print-header">
                    <h1>Savaji Restaurant</h1>
                    <p>Restaurant Billing Receipt</p>
                </div>
                <div class="print-meta">
                    <span><strong>Bill No:</strong> ${billNumber}</span>
                    <span><strong>Date:</strong> ${dateText}</span>
                </div>
                <table class="print-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(item => `
                            <tr>
                                <td>${item.name} (${item.portion})</td>
                                <td>${item.qty}</td>
                                <td>₹${item.price}</td>
                                <td>₹${item.total}</td>
                            </tr>`).join("")}
                    </tbody>
                </table>
                <div class="print-total">
                    <span>Grand Total</span>
                    <span>₹${total}</span>
                </div>
                <div class="print-footer">Thank you for visiting Savaji Restaurant!</div>
            `;

            const button = document.querySelector(".btn-print");
            const oldText = button ? button.innerHTML : "";
            if (button) {
                button.disabled = true;
                button.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Printing...';
            }

            try {
                // First use an already-connected printer.
                if (serialPort && serialWriter) {
                    await printReceiptToSerial(serialPort, items, total, billNumber, dateText);
                } else if (bluetoothCharacteristic) {
                    await printReceiptToBluetooth(items, total, billNumber, dateText);
                } else {
                    // One click can request either BLE or Serial permission.
                    // BLE is attempted first; if it is not usable, Serial is tried.
                    const connected = await ensurePrinterConnection();
                    if (!connected) {
                        throw new Error("No compatible printer connection was established.");
                    }

                    if (serialPort && serialWriter) {
                        await printReceiptToSerial(serialPort, items, total, billNumber, dateText);
                    } else if (bluetoothCharacteristic) {
                        await printReceiptToBluetooth(items, total, billNumber, dateText);
                    } else {
                        throw new Error("Printer connected but no writable printer channel was found.");
                    }
                }

                // Save only after the receipt was successfully sent.
                saveBillToHistory(billNumber, dateText);

                // Clear the current order after successful printing.
                cart = {};
                updateCart();

                alert("Bill printed successfully on " + PRINTER_NAME + ".");
            } catch (error) {
                console.error("Print error:", error);
                alert(
                    "Print nahi hua.\n\n" +
                    "Printer 'Izo Printer' ON aur Windows Bluetooth me paired rakhen. " +
                    "Agar printer COM port ke roop me paired hai to Serial option use hoga.\n\n" +
                    "Error: " + (error.message || error)
                );
            } finally {
                if (button) {
                    button.disabled = false;
                    button.innerHTML = oldText;
                }
            }
        }

        function escPosText(text) {
            // Thermal printers commonly accept ASCII reliably.
            // Convert the rupee sign to Rs. to avoid unsupported-glyph output.
            return String(text).replace(/₹/g, "Rs.");
        }

        function padRight(text, length) {
            text = String(text);
            return text.length >= length ? text.slice(0, length) : text + " ".repeat(length - text.length);
        }

        function padLeft(text, length) {
            text = String(text);
            return text.length >= length ? text.slice(0, length) : " ".repeat(length - text.length) + text;
        }

        function fitItemName(name, maxLength) {
            name = String(name);
            return name.length <= maxLength ? name : name.slice(0, Math.max(0, maxLength - 1)) + "…";
        }

        function buildReceiptBytes(items, total, billNumber, dateText) {
            // 58mm / 32-column ESC/POS receipt.
            const WIDTH = 32;
            const lines = [];

            lines.push("\x1b@");                 // Initialize printer
            lines.push("\x1ba\x01");            // Center
            lines.push("\x1b!\x08");            // Bold
            lines.push("SAVAJI RESTAURANT\n");
            lines.push("\x1b!\x00");
            lines.push("Restaurant Billing Receipt\n");
            lines.push("--------------------------------\n");

            lines.push("\x1ba\x00");             // Left
            lines.push("Bill No: " + billNumber + "\n");
            lines.push("Date: " + dateText + "\n");
            lines.push("--------------------------------\n");

            // 32 columns: item 18 + qty 4 + amount 10
            lines.push(
                padRight("Item", 18) +
                padLeft("Qty", 4) +
                padLeft("Amount", 10) + "\n"
            );
            lines.push("--------------------------------\n");

            items.forEach(item => {
                const itemName = fitItemName(
                    escPosText(item.name) + " (" + escPosText(item.portion) + ")",
                    18
                );
                const amount = "Rs." + item.total;
                lines.push(
                    padRight(itemName, 18) +
                    padLeft(item.qty, 4) +
                    padLeft(amount, 10) + "\n"
                );
            });

            lines.push("--------------------------------\n");
            lines.push("\x1b!\x08");
            lines.push(padRight("GRAND TOTAL", 18) + padLeft("Rs." + total, 14) + "\n");
            lines.push("\x1b!\x00");
            lines.push("\n");
            lines.push("\x1ba\x01");
            lines.push("Thank you for visiting!\n");
            lines.push("Savaji Restaurant\n");
            lines.push("\n\n\n");
            lines.push("\x1dV\x00");            // Full cut, if supported

            return new TextEncoder().encode(lines.join(""));
        }

        async function writeChunked(writer, bytes, chunkSize = 180) {
            for (let i = 0; i < bytes.length; i += chunkSize) {
                await writer.write(bytes.slice(i, i + chunkSize));
                await new Promise(resolve => setTimeout(resolve, 12));
            }
        }

        async function printReceiptToSerial(port, items, total, billNumber, dateText) {
            if (!port.writable) {
                throw new Error("Serial printer port is not writable.");
            }

            if (!serialWriter) {
                serialWriter = port.writable.getWriter();
            }

            const bytes = buildReceiptBytes(items, total, billNumber, dateText);
            await writeChunked(serialWriter, bytes);
        }

        async function printReceiptToBluetooth(items, total, billNumber, dateText) {
            if (!bluetoothCharacteristic) {
                throw new Error("Bluetooth printer write characteristic is unavailable.");
            }

            const bytes = buildReceiptBytes(items, total, billNumber, dateText);

            // BLE characteristics usually have small packet limits.
            const chunkSize = bluetoothCharacteristic.properties.writeWithoutResponse ? 180 : 20;

            for (let i = 0; i < bytes.length; i += chunkSize) {
                const chunk = bytes.slice(i, i + chunkSize);

                if (bluetoothCharacteristic.properties.writeWithoutResponse &&
                    bluetoothCharacteristic.writeValueWithoutResponse) {
                    await bluetoothCharacteristic.writeValueWithoutResponse(chunk);
                } else {
                    await bluetoothCharacteristic.writeValue(chunk);
                }

                await new Promise(resolve => setTimeout(resolve, 25));
            }
        }

        async function findWritableBluetoothCharacteristic(server) {
            const services = await server.getPrimaryServices();

            for (const service of services) {
                const characteristics = await service.getCharacteristics();

                for (const characteristic of characteristics) {
                    const p = characteristic.properties || {};
                    if (p.writeWithoutResponse || p.write) {
                        return characteristic;
                    }
                }
            }

            return null;
        }

        async function connectBluetoothPrinter(showAlerts = false) {
            if (!navigator.bluetooth) {
                if (showAlerts) {
                    alert("Web Bluetooth उपलब्ध नहीं है. Chrome/Edge में try करें.");
                }
                return false;
            }

            const status = document.getElementById("bluetoothStatus");

            try {
                if (status) status.innerText = "Bluetooth printer खोज रहे हैं...";

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: COMMON_BLE_SERVICES
                });

                if (!bluetoothDevice) {
                    throw new Error("Bluetooth device was not selected.");
                }

                if (status) status.innerText = "Connecting to " + (bluetoothDevice.name || PRINTER_NAME) + "...";

                bluetoothServer = bluetoothDevice.gatt
                    ? await bluetoothDevice.gatt.connect()
                    : null;

                if (!bluetoothServer) {
                    throw new Error("This Bluetooth device does not expose GATT/BLE.");
                }

                bluetoothCharacteristic = await findWritableBluetoothCharacteristic(bluetoothServer);

                if (!bluetoothCharacteristic) {
                    throw new Error("No writable BLE characteristic found.");
                }

                bluetoothDevice.addEventListener("gattserverdisconnected", () => {
                    bluetoothServer = null;
                    bluetoothCharacteristic = null;
                    if (status) status.innerText = "Bluetooth printer disconnected.";
                });

                if (status) {
                    status.innerText = "Connected: " + (bluetoothDevice.name || PRINTER_NAME);
                }

                return true;
            } catch (error) {
                console.warn("BLE printer connection failed:", error);
                bluetoothCharacteristic = null;
                bluetoothServer = null;
                if (status) status.innerText = "BLE connection unavailable.";
                return false;
            }
        }

        async function connectSerialPrinter(showAlerts = false) {
            if (!("serial" in navigator)) {
                if (showAlerts) {
                    alert("Web Serial उपलब्ध नहीं है. Chrome/Edge का latest version use करें.");
                }
                return false;
            }

            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: PRINTER_BAUD_RATE });

                serialPort = port;
                serialWriter = serialPort.writable ? serialPort.writable.getWriter() : null;

                if (!serialWriter) {
                    throw new Error("Selected serial port is not writable.");
                }

                const status = document.getElementById("bluetoothStatus");
                if (status) status.innerText = "Connected by Serial/COM at 9600 baud.";

                return true;
            } catch (error) {
                console.warn("Serial printer connection failed:", error);
                serialPort = null;
                serialWriter = null;
                return false;
            }
        }

        async function ensurePrinterConnection() {
            // Try BLE first. If the printer is a Bluetooth Classic/SPP device,
            // Chrome exposes it as a serial COM port instead, so try Web Serial.
            const bleConnected = await connectBluetoothPrinter(false);
            if (bleConnected) return true;

            const serialConnected = await connectSerialPrinter(false);
            if (serialConnected) return true;

            return false;
        }

        async function connectPrinter() {
            const status = document.getElementById("bluetoothStatus");

            if (status) {
                status.innerText = "Izo Printer connection सुरू आहे...";
            }

            // Try BLE first, then COM/Serial.
            const bleConnected = await connectBluetoothPrinter(false);
            if (bleConnected) {
                alert("Izo Printer Bluetooth/BLE connected successfully.");
                return;
            }

            const serialConnected = await connectSerialPrinter(false);
            if (serialConnected) {
                alert("Izo Printer Serial/COM connected successfully.");
                return;
            }

            if (status) {
                status.innerText = "Printer connect झाला नाही.";
            }

            alert(
                "Izo Printer connect झाला नाही.\n\n" +
                "1) Printer ON करा.\n" +
                "2) Windows Bluetooth मध्ये 'Izo Printer' pair करा.\n" +
                "3) पुन्हा printer button दाबा.\n\n" +
                "जर तो Bluetooth Classic printer असेल तर Windows ने त्याला COM port दिलेला असणे आवश्यक आहे."
            );
        }

        function toggleDropdown() {
            document.getElementById("dropdownMenu").classList.toggle("show");
        }

        function closeDropdown() {
            document.getElementById("dropdownMenu").classList.remove("show");
        }

        document.addEventListener("click", function(event) {
            const menuIcon = document.querySelector(".menu-icon");
            const dropdown = document.getElementById("dropdownMenu");

            if (dropdown && menuIcon && !menuIcon.contains(event.target)) {
                dropdown.classList.remove("show");
            }
        });

        function toggleAuth() {
            const loggedIn = localStorage.getItem("savajiLoggedIn") === "true";

            if (loggedIn) {
                if (confirm("Logout करना है?")) {
                    localStorage.removeItem("savajiLoggedIn");
                    alert("Logout successful.");
                }
            } else {
                openModal("loginModal");
            }
        }

        function loginUser() {
            const username = document.getElementById("loginUsername").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            if (!username || !password) {
                alert("Username और Password दोनों भरें।");
                return;
            }

            localStorage.setItem("savajiLoggedIn", "true");
            localStorage.setItem("savajiUsername", username);
            closeModal("loginModal");
            alert("Login successful.");
        }

        function openProfile() {
            const profile = JSON.parse(localStorage.getItem("savajiProfile") || "{}");

            document.getElementById("profileName").value = profile.name || "";
            document.getElementById("profileMobile").value = profile.mobile || "";
            document.getElementById("profileAddress").value = profile.address || "";

            openModal("profileModal");
        }

        function saveProfile() {
            const profile = {
                name: document.getElementById("profileName").value.trim(),
                mobile: document.getElementById("profileMobile").value.trim(),
                address: document.getElementById("profileAddress").value.trim()
            };

            localStorage.setItem("savajiProfile", JSON.stringify(profile));
            closeModal("profileModal");
            alert("Profile saved successfully.");
        }

        function openHistory() {
            const history = JSON.parse(localStorage.getItem("savajiBillingHistory") || "[]");
            const list = document.getElementById("historyList");

            if (history.length === 0) {
                list.innerHTML = `<div class="empty-cart">No billing history found.</div>`;
            } else {
                list.innerHTML = history.map(bill => `
                    <div class="history-item">
                        <strong>${bill.billNumber} — ₹${bill.total}</strong>
                        <small>${bill.date}</small>
                        <div style="margin-top:7px;font-size:.85rem;">
                            ${bill.items.map(item => `${item.name} (${item.portion}) × ${item.qty}`).join(", ")}
                        </div>
                    </div>
                `).join("");
            }

            openModal("historyModal");
        }

        function openBluetooth() {
            openModal("bluetoothModal");
        }

        async function connectPrinter() {
            const status = document.getElementById("bluetoothStatus");

            if (!navigator.bluetooth) {
                alert("इस browser में Web Bluetooth supported नहीं है। Chrome/Edge में HTTPS या localhost पर try करें।");
                if (status) status.innerText = "Web Bluetooth not supported in this browser.";
                return;
            }

            try {
                status.innerText = "Searching for Bluetooth devices...";

                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });

                status.innerText = "Connected/selected: " + bluetoothDevice.name;
                alert("Bluetooth printer/device selected: " + bluetoothDevice.name);
            } catch (error) {
                status.innerText = "Printer connection cancelled or unavailable.";
                console.log(error);
            }
        }

        function openModal(id) {
            document.getElementById(id).classList.add("show");
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove("show");
        }

        window.addEventListener("click", function(event) {
            document.querySelectorAll(".modal").forEach(modal => {
                if (event.target === modal) {
                    modal.classList.remove("show");
                }
            });
        });

        // Food search
        document.getElementById("searchBar").addEventListener("input", function() {
            const query = this.value.trim().toLowerCase();
            const results = document.getElementById("searchResults");

            if (!query) {
                results.classList.remove("show");
                results.innerHTML = "";
                return;
            }

            const matches = [];
            menuData.forEach(cat => {
                cat.items.forEach(item => {
                    if (item.name.toLowerCase().includes(query)) {
                        matches.push({
                            ...item,
                            category: cat.category
                        });
                    }
                });
            });

            if (!matches.length) {
                results.innerHTML = `<div class="search-result-item">No food found</div>`;
            } else {
                results.innerHTML = matches.slice(0, 8).map(item => `
                    <div class="search-result-item" onclick="selectSearchItem('${escapeQuotes(item.name)}')">
                        <strong>${item.name}</strong>
                        <small style="display:block;color:#64748b;">${item.category} · ₹${item.full}</small>
                    </div>
                `).join("");
            }

            results.classList.add("show");
        });

        function selectSearchItem(name) {
            const target = [...document.querySelectorAll(".item-card")].find(card =>
                card.querySelector(".item-name")?.innerText.toLowerCase() === name.toLowerCase()
            );

            if (target) {
                target.scrollIntoView({ behavior:"smooth", block:"center" });
                target.style.outline = "3px solid #d97706";
                setTimeout(() => target.style.outline = "", 1500);
            }

            document.getElementById("searchResults").classList.remove("show");
        }

        document.addEventListener("click", function(event) {
            const searchBox = document.querySelector(".search-container");
            if (searchBox && !searchBox.contains(event.target)) {
                document.getElementById("searchResults").classList.remove("show");
            }
        });

        renderMenu();
        updateCart();
    </script>
